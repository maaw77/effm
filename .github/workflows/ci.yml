name: CI

on:
  push:
    branches: [ main, hw, home_v1 ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.25.4'

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: epas
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: |
        go mod tidy
        go mod download

    - name: Wait for PostgreSQL
      run: |
        for i in {1..15}; do
          pg_isready -h localhost -p 5432 -U postgres && break
          echo "Waiting for PostgreSQL... ($i/15)"
          sleep 2
        done

    - name: Run migrations
      run: |
        go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
        sleep 3
        migrate -path migrations -database "postgres://postgres:epas@localhost:5432/postgres?sslmode=disable" up

    - name: Build the application
      run: |
        go build -v ./cmd/server

    - name: Run tests
      run: |
        go test -v -race ./... -timeout 3m

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: v1.54
        args: --timeout=3m --skip-dirs=vendor --build-tags=postgres