services:
  db:
    image: postgres:17-alpine     # фиксируем версию, чтобы не прилетел 18 и не сломал
    container_name: effm_postgres
    restart: always
    env_file:
      - ./.env                    # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD и т.д.
    environment:
      TZ: Europe/Moscow
    ports:
      - "5433:5432"               # на хосте 5433, внутри контейнера обычный 5432
    volumes:
      - postgres_data:/var/lib/postgresql   # ← ЭТО САМОЕ ГЛАВНОЕ ДЛЯ Postgres 17+
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 30s
      retries: 5

  effm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: effm_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Moscow

volumes:
  postgres_data: